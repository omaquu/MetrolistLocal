name: Bisect A (verbatim copy)
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bisect-a-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_foss_debug:
    name: Build signed debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build FOSS Debug APK (LinkHub Remote mukana)
        run: ./gradlew --console=plain assembleFossDebug --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: fi.pina.metrolistlinkhub
          METROLIST_APP_NAME: MetrolistLinkHub
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
